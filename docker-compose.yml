services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Browser connects straight to the published backend port on the
      # Mac host — same pattern as the Netlify+Railway production split
      # (see deploy.md), so no inter-container proxying is needed.
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
